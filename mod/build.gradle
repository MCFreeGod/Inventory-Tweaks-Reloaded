plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${project.mod_version}-${project.minecraft_version}"
group = project.mod_group_id

base {
    archivesName = "[NeoForge] ${project.mod_id}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = project.neoforge_version

    // Access transformers: the classic buttons are anchored to the GUI frame
    // (leftPos/topPos/imageWidth/imageHeight) and middle-click needs the
    // hovered slot. The 26.3 sources jar shows them as public, but the compiled
    // artifact still declares them protected, so this is required.
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    runs {
        client {
            client()
        }
        // Opt-in end-to-end verification of the click-based sorting engine:
        //   ./gradlew runClientSelftest -Pinvtweaksreloaded.world=<world folder>
        // It enters that world directly, sorts a seeded inventory through real
        // click packets, compares the server's copy, and closes the game with
        // the verdict in the log.
        clientSelftest {
            client()
            systemProperty 'invtweaksreloaded.selftest', 'true'
            def world = project.findProperty('invtweaksreloaded.world')
            if (world) {
                programArguments.addAll '--quickPlaySingleplayer', world.toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    // Optional mirror for the NeoForged maven, for networks where the official
    // host is slow. Point it at a mirror in your own ~/.gradle/gradle.properties:
    //   neoforgedMirror=https://example.invalid/maven
    def mirror = project.findProperty('neoforgedMirror')
    if (mirror) {
        maven {
            name = 'NeoForgedMirror'
            url = mirror.toString()
            content {
                includeGroupByRegex 'net\\.neoforged.*'
                includeGroup 'net.minecraftforge'
            }
        }
    }
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// MDG does not expose Minecraft on the test classpath by default. Reusing the
// main classpath lets the pure-logic tests touch ItemStack/Component stubs
// without pulling in fancymodloader's unpublished junit-fml artifact.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            mod_id             : project.mod_id,
            mod_name           : project.mod_name,
            mod_version        : project.mod_version,
            minecraft_version  : project.minecraft_version,
            neoforge_version   : project.neoforge_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/resources/modmetadata'
}

sourceSets.main.resources {
    srcDir generateModMetadata
}

neoForge.ideSyncTask generateModMetadata

tasks.named('jar') {
    def licence = file('../LICENSE')
    if (licence.exists()) {
        from(licence) {
            rename { 'LICENSE-invtweaksreloaded' }
        }
    }
}
