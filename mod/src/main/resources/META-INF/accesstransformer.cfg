# Access transformers for Inventory Tweaks: Reloaded.
#
# The classic Inventory Tweaks buttons are anchored to the GUI frame, and
# middle-click sorting needs to know which slot is under the cursor. Vanilla
# keeps these members protected. Mixins are deliberately avoided: an access
# transformer is the smallest possible footprint and cannot break other mods'
# screens.
#
# (The 26.3 sources jar shows these as public, but the compiled artifact the
# dev workspace links against still declares them protected, so this file is
# load-bearing. Do not delete it.)

public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen leftPos
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen topPos
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageWidth
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageHeight
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen hoveredSlot
